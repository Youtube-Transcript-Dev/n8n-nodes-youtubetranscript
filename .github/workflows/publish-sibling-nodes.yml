# Publish sibling community nodes (public repos) using this repo's NPM_TOKEN.
# Provenance attests this workflow; packages are also pushed from their own repos later.
name: Publish sibling n8n nodes

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - n8n-nodes-removebackground
          - n8n-nodes-sociallinks
          - n8n-nodes-monitormentions
          - n8n-nodes-kovered
          - all

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - n8n-nodes-removebackground
          - n8n-nodes-sociallinks
          - n8n-nodes-monitormentions
          - n8n-nodes-kovered
    steps:
      - name: Skip if not selected
        id: gate0
        run: |
          if [ "${{ inputs.package }}" = "all" ] || [ "${{ inputs.package }}" = "${{ matrix.package }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.package }}"
          fi
      - uses: actions/checkout@v4
        if: steps.gate0.outputs.run == 'true'
        with:
          repository: Youtube-Transcript-Dev/${{ matrix.package }}
          ref: main
      - uses: actions/setup-node@v4
        if: steps.gate0.outputs.run == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check version
        if: steps.gate0.outputs.run == 'true'
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate0.outputs.run == 'true' && steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.gate0.outputs.run == 'true' && steps.version.outputs.publish == 'true'
        run: npm run lint
      - if: steps.gate0.outputs.run == 'true' && steps.version.outputs.publish == 'true'
        run: npm run build
      - name: Publish with provenance
        if: steps.gate0.outputs.run == 'true' && steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: "true"
        run: npm publish --provenance --access public
